services:
  volume-backup:
    build: ./volume-backup
    restart: unless-stopped
    container_name: volume-backup
    volumes:
      - ./volume-backup/rclone.conf:/root/.config/rclone/rclone.conf
      - caddy_data:/data/caddy_data
      - caddy_config:/data/caddy_config
      - pihole_data:/data/pihole_data
      - budget_data:/data/budget_data
  caddy:
    build: ./caddy
    restart: unless-stopped
    container_name: caddy
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/index.html:/usr/share/caddy/index.html
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
    networks:
      - caddy # add other containers onto this network to use dns name
    
  samba:
    image: ghcr.io/servercontainers/samba
    restart: unless-stopped
    container_name: samba
    ports:
      - 1137:137/udp
      - 1138:138/udp
      - 1139:139
      - 1445:445
    environment:
      SAMBA_CONF_LOG_LEVEL: "1"
      SAMBA_CONF_SERVER_SIGNING: auto
      SAMBA_CONF_SOCKET_OPTIONS: "TCP_NODELAY IPTOS_LOWDELAY SO_KEEPALIVE SO_RCVBUF=131072 SO_SNDBUF=131072"
      SAMBA_CONF_DEAD_TIME: "0"
      SAMBA_CONF_KEEPALIVE: "60"
      SAMBA_CONF_MIN_PROTOCOL: SMB2
      SAMBA_CONF_MAX_PROTOCOL: SMB3
      SAMBA_CONF_READ_RAW: "yes"
      SAMBA_CONF_WRITE_RAW: "yes"
      SAMBA_CONF_AIO_READ_SIZE: "1"
      SAMBA_CONF_AIO_WRITE_SIZE: "1"
      ACCOUNT_samba: ${SAMBA_PASSWORD}
      SAMBA_VOLUME_CONFIG_share: |
        [share]
            path = /share
            browseable = yes
            read only = no
            valid users = samba
            vfs objects = catia fruit streams_xattr
            fruit:aapl = yes
            fruit:model = MacSamba
            fruit:posix_rename = yes
            oplocks = no
            level2 oplocks = no
            strict locking = no
    volumes:
      - "${SAMBA_SHARE_PATH}:/share"
    tmpfs:
      - /run/samba
    sysctls:
      - net.ipv4.tcp_keepalive_time=60
      - net.ipv4.tcp_keepalive_intvl=10
      - net.ipv4.tcp_keepalive_probes=6
  timemachine:
    restart: unless-stopped
    container_name: timemachine
    hostname: timemachine
    ports:
      - 137:137/udp
      - 138:138/udp
      - 139:139
      - 445:445
    environment:
      - TM_USERNAME=timemachine
      - "PASSWORD=${TM_PASSWORD}"
      - 'VOLUME_SIZE_LIMIT=2 T'
    volumes:
      - "${TM_DATA_PATH}:/opt/timemachine"
    tmpfs:
      - /run/samba
    image: 'mbentley/timemachine:smb'

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "8080:80/tcp"
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      TZ: 'America/Indiana/Indianapolis'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: '2get2pihole'
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
      FTLCONF_dns_listeningMode: 'ALL'
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - 'pihole_data:/etc/pihole'
    restart: unless-stopped
    networks:
      - caddy
  budget-backend:
    container_name: budget-backend
    build: ./budget-app/backend
    environment:
      - DB_PATH=/app/data/budget.db
    volumes:
      - budget_data:/app/data
    restart: unless-stopped
    networks:
      - budget
  budget-frontend:
    container_name: budget-frontend
    restart: unless-stopped
    build: ./budget-app/frontend
    depends_on:
      - budget-backend
    networks:
      - caddy
      - budget

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Indiana/Indianapolis
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - jellyfin_config:/config
      - ${JELLYFIN_MEDIA_PATH}:/data/media:ro
    networks:
      - caddy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  caddy_data:
  caddy_config:
  pihole_data:
  budget_data:
  jellyfin_config:
# create this first before running the docker-compose - docker network create caddy
networks:
  caddy:
    driver: bridge
  budget:
    driver: bridge
    #external: true