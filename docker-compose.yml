services:
  volume-backup:
    build: ./volume-backup
    restart: unless-stopped
    container_name: volume-backup
    volumes:
      - ./volume-backup/rclone.conf:/root/.config/rclone/rclone.conf
      - caddy_data:/data/caddy_data
      - caddy_config:/data/caddy_config
      - pihole_data:/data/pihole_data
      - budget_data:/data/budget_data
      - tradebot_data:/data/tradebot_data
      - price_tracker_data:/data/price_tracker_data
      - calibre_config:/data/calibre_config
  caddy:
    build: ./caddy
    restart: unless-stopped
    container_name: caddy
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/index.html:/usr/share/caddy/index.html
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
    networks:
      - caddy # add other containers onto this network to use dns name
    
  timemachine:
    restart: unless-stopped
    container_name: timemachine
    hostname: timemachine
    ports:
      - 137:137/udp
      - 138:138/udp
      - 139:139
      - 445:445
    environment:
      - TM_USERNAME=timemachine
      - "PASSWORD=${TM_PASSWORD}"
      - 'VOLUME_SIZE_LIMIT=2 T'
    volumes:
      - "${TM_DATA_PATH}:/opt/timemachine"
    tmpfs:
      - /run/samba
    image: 'mbentley/timemachine:smb'

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "8080:80/tcp"
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      TZ: 'America/Indiana/Indianapolis'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: '2get2pihole'
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
      FTLCONF_dns_listeningMode: 'ALL'
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - 'pihole_data:/etc/pihole'
    restart: unless-stopped
    networks:
      - caddy
  budget-backend:
    container_name: budget-backend
    build: ./budget-app/backend
    environment:
      - DB_PATH=/app/data/budget.db
    volumes:
      - budget_data:/app/data
    restart: unless-stopped
    networks:
      - budget
  budget-frontend:
    container_name: budget-frontend
    restart: unless-stopped
    build: ./budget-app/frontend
    depends_on:
      - budget-backend
    networks:
      - caddy
      - budget

  tradebot:
    build: ./tradebot
    container_name: tradebot
    restart: unless-stopped
    environment:
      - TRADEBOT_DASHBOARD_PASSWORD=${TRADEBOT_DASHBOARD_PASSWORD}
      - TRADEBOT_ALPACA_API_KEY=${TRADEBOT_ALPACA_API_KEY}
      - TRADEBOT_ALPACA_API_SECRET=${TRADEBOT_ALPACA_API_SECRET}
      - TRADEBOT_POLYMARKET_PRIVATE_KEY=${TRADEBOT_POLYMARKET_PRIVATE_KEY}
      - TRADEBOT_CONFIRM_LIVE=${TRADEBOT_CONFIRM_LIVE}
    volumes:
      - tradebot_data:/data
    networks:
      - caddy

  price-tracker-web:
    build: ./price-tracker
    container_name: price-tracker-web
    restart: unless-stopped
    environment: &price-tracker-env
      - DATABASE_URL=sqlite:////data/price_tracker.db
      - SCRAPE_INTERVAL_HOURS=${PRICETRACKER_SCRAPE_INTERVAL_HOURS}
      - PRICE_HISTORY_RETENTION_DAYS=${PRICETRACKER_PRICE_HISTORY_RETENTION_DAYS}
      - SMTP_HOST=${PRICETRACKER_SMTP_HOST}
      - SMTP_PORT=${PRICETRACKER_SMTP_PORT}
      - SMTP_USER=${PRICETRACKER_SMTP_USER}
      - SMTP_PASS=${PRICETRACKER_SMTP_PASS}
      - EMAIL_FROM=${PRICETRACKER_EMAIL_FROM}
      - EMAIL_TO=${PRICETRACKER_EMAIL_TO}
    volumes:
      - price_tracker_data:/data
    networks:
      - caddy

  price-tracker-worker:
    build: ./price-tracker
    container_name: price-tracker-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment: *price-tracker-env
    volumes:
      - price_tracker_data:/data

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Indiana/Indianapolis
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - jellyfin_config:/config
      - ${JELLYFIN_MEDIA_PATH}:/data/media:ro
    networks:
      - caddy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  calibre-web-automated:
    image: crocodilestickcollective/calibre-web-automated:latest
    container_name: calibre-web-automated
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Indiana/Indianapolis
    volumes:
      - calibre_config:/config
      - calibre_library:/calibre-library
      - calibre_ingest:/cwa-book-ingest
    networks:
      - caddy

volumes:
  caddy_data:
  caddy_config:
  pihole_data:
  budget_data:
  jellyfin_config:
  tradebot_data:
  price_tracker_data:
  # Calibre volumes are bind-backed onto the ZFS array (see CALIBRE_*_PATH in .env)
  calibre_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CALIBRE_CONFIG_PATH}
  calibre_library:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CALIBRE_LIBRARY_PATH}
  calibre_ingest:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CALIBRE_INGEST_PATH}
# create this first before running the docker-compose - docker network create caddy
networks:
  caddy:
    driver: bridge
  budget:
    driver: bridge
    #external: true