services:
  caddy:
    restart: unless-stopped
    container_name: caddy
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/index.html:/usr/share/caddy/index.html
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy # add other containers onto this network to use dns name
    image: caddy:latest
    
  timemachine:
    restart: unless-stopped
    container_name: timemachine
    hostname: timemachine
    ports:
      - 137:137/udp
      - 138:138/udp
      - 139:139
      - 445:445
    environment:
      - TM_USERNAME=timemachine
      - "PASSWORD=${TM_PASSWORD}"
      - 'VOLUME_SIZE_LIMIT=1 T'
    volumes:
      - "${TM_DATA_PATH}:/opt/timemachine"
    tmpfs:
      - /run/samba
    image: 'mbentley/timemachine:smb'

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "8080:80/tcp"
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      TZ: 'America/Indiana/Indianapolis'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: '2get2pihole'
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
      FTLCONF_dns_listeningMode: 'ALL'
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - './pihole/etc-pihole:/etc/pihole'
    restart: unless-stopped
    networks:
      - caddy

volumes:
  caddy_data:
  caddy_config:
# create this first before running the docker-compose - docker network create caddy
networks:
  caddy:
    driver: bridge
    #external: true