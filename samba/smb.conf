[global]
    workgroup = WORKGROUP
    server string = Samba Server
    security = user
    map to guest = Bad User
    log file = /dev/stdout
    log level = 2

    # Keepalive / connection stability
    socket options = TCP_NODELAY IPTOS_LOWDELAY SO_KEEPALIVE
    keepalive = 30
    dead time = 0

    # Protocol
    min protocol = SMB2
    max protocol = SMB3

    # Async I/O - prevents smbd from blocking on slow disk reads
    # Without this, a stalled HDD read stalls the entire SMB connection
    aio read size = 1
    aio write size = 1
    read raw = yes
    write raw = yes

    # Mac compatibility
    vfs objects = catia fruit
    fruit:aapl = yes
    fruit:metadata = netatalk
    fruit:model = MacSamba
    fruit:posix_rename = yes
    fruit:resource = xattr
    fruit:convert = false

    oplocks = no
    level2 oplocks = no
    strict sync = no

    create mask = 0664
    force create mode = 0664
    directory mask = 0775
    force directory mode = 0775

    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

[share]
    path = /share
    browseable = yes
    read only = no
    valid users = samba
