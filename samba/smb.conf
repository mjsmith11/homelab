[global]
    workgroup = WORKGROUP
    server string = Samba Server
    security = user
    map to guest = Bad User

    # Keepalive / connection stability
    socket options = TCP_NODELAY IPTOS_LOWDELAY SO_KEEPALIVE
    keepalive = 30
    dead time = 0

    # Protocol
    min protocol = SMB2
    max protocol = SMB3

    # Mac compatibility
    vfs objects = catia fruit streams_xattr
    fruit:aapl = yes
    fruit:metadata = stream
    fruit:model = MacSamba
    fruit:posix_rename = yes

    # Encoding-friendly
    oplocks = no
    level2 oplocks = no
    strict sync = no
    read raw = yes
    write raw = yes

    # File permissions
    create mask = 0664
    force create mode = 0664
    directory mask = 0775
    force directory mode = 0775
    force user = samba
    force group = samba

    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

[share]
    path = /share
    browseable = yes
    read only = no
    valid users = samba
