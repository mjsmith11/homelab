[global]
    workgroup = WORKGROUP
    server string = Samba Server
    security = user
    map to guest = Bad User
    log file = /var/log/samba/log.%m
    log level = 1
    max log size = 10000

    smb ports = 1445

    socket options = TCP_NODELAY IPTOS_LOWDELAY SO_KEEPALIVE
    keepalive = 10
    dead time = 0

    min protocol = SMB2
    max protocol = SMB3

    aio read size = 1
    aio write size = 1
    read raw = yes
    write raw = yes

    # Mac compatibility
    vfs objects = catia fruit
    fruit:aapl = yes
    fruit:metadata = netatalk
    fruit:model = MacSamba
    fruit:posix_rename = yes
    fruit:resource = xattr
    fruit:convert = false

    oplocks = no
    level2 oplocks = no
    strict sync = no

    create mask = 0664
    force create mode = 0664
    directory mask = 0775
    force directory mode = 0775

    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

[share]
    path = /data/storage/kitty-pool
    browseable = yes
    read only = no
    valid users = samba
    force user = matt
